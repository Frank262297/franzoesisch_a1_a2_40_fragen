<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Französisch A1+/A2 Quiz – Kahoot-Stil</title>
<style>
:root{--bg1:#46178f;--bg2:#25076b;--card:#fff;--text:#181818;--muted:#666;--ok:#d8f7df;--bad:#ffe0e0}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:white;min-height:100vh}
.app{max-width:1050px;margin:0 auto;padding:24px} header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-weight:900;font-size:28px} .pill{background:rgba(255,255,255,.16);padding:10px 14px;border-radius:999px;font-weight:800}
.screen{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.card{background:var(--card);color:var(--text);border-radius:24px;padding:24px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
h1{font-size:34px;margin-top:0} h2{font-size:27px;margin-top:0;line-height:1.25} .center{text-align:center} .muted{color:var(--muted)}
button{border:0;border-radius:18px;padding:14px 20px;font-size:18px;font-weight:900;cursor:pointer;transition:.15s transform,.15s opacity} button:hover{transform:scale(1.02)}
.start{background:#ffdd33;color:#2d1764;font-size:22px} .primary{background:#46178f;color:white} .smallBtn{font-size:16px;padding:10px 14px;border-radius:14px;background:#eee;color:#222}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px} .answer{min-height:92px;color:white;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:21px;line-height:1.25}
.answer:nth-child(1){background:#e21b3c} .answer:nth-child(2){background:#1368ce} .answer:nth-child(3){background:#d89e00} .answer:nth-child(4){background:#26890c} .shape{font-size:25px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px} .progress{height:14px;background:#eee;border-radius:20px;overflow:hidden;flex:1} .bar{height:100%;background:#ffdd33}
.bigEmoji{font-size:74px;margin:10px 0 14px} .feedback{margin-top:16px;padding:14px;border-radius:18px;font-size:18px;font-weight:800;display:none} .ok{background:var(--ok);color:#116b28} .bad{background:var(--bad);color:#9b1111}
.imageRow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px} .imageChoice{background:#f2f2f2;border:5px solid transparent;border-radius:22px;padding:22px;cursor:pointer;text-align:center;font-size:76px;min-height:145px;display:flex;align-items:center;justify-content:center} .imageChoice.selected{border-color:#46178f;background:#eee6ff}
.dragZone,.dropZone{display:flex;flex-wrap:wrap;gap:10px;min-height:72px;border-radius:18px;padding:12px} .dragZone{background:#f0eef9} .dropZone{background:#fff7d2;border:3px dashed #d89e00;margin-top:14px}
.tile{background:#46178f;color:white;border-radius:14px;padding:12px 16px;font-weight:900;font-size:20px;cursor:grab;user-select:none} .dropZone .tile{background:#1368ce}
.footerButtons{display:flex;justify-content:space-between;margin-top:18px;gap:10px} input{width:100%;padding:14px;border:2px solid #ddd;border-radius:16px;font-size:20px}
.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px} .mem{background:#eee;border-radius:18px;min-height:92px;font-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid transparent;padding:8px;text-align:center} .mem.revealed{background:#fff2b8;border-color:#f9c74f} .mem.matched{background:#d8f7df;border-color:#2ecc71;cursor:default}
.finalScore{font-size:52px;font-weight:900;color:#46178f} @media(max-width:700px){.answers,.imageRow{grid-template-columns:1fr}.memoryGrid{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}.answer{font-size:19px}.imageChoice{min-height:115px;font-size:62px}}
</style>
</head>
<body>
<div class="app"><header><div class="logo">Französisch A1+/A2 🎉</div><div class="pill">40 neue Aufgaben</div></header><main id="app" class="screen"></main></div>
<script>
const questions = [{"type": "choice", "q": "Welche Antwort passt? — Qu'est-ce que tu prends au petit déjeuner ?", "options": ["Je prends du pain et du chocolat chaud.", "Je vais au cinéma.", "J'habite à Cologne.", "Il est huit heures."], "answer": 0, "explain": "Die Frage bedeutet: Was nimmst/isst du zum Frühstück?"}, {"type": "drag", "q": "Baue den Satz: „Morgen fahre ich mit meiner Familie nach Paris.“", "words": ["Demain", "je vais", "à Paris", "avec ma famille"], "answer": ["Demain", "je vais", "à Paris", "avec ma famille"], "explain": "Richtig: Demain, je vais à Paris avec ma famille."}, {"type": "image", "q": "Klicke auf das Bild, das zu „la gare“ passt.", "options": [{"emoji": "🏖️"}, {"emoji": "🚉"}, {"emoji": "🏫"}], "answer": 1, "explain": "La gare = der Bahnhof."}, {"type": "choice", "q": "Was bedeutet „Je cherche la pharmacie“?", "options": ["Ich suche die Apotheke.", "Ich kaufe Brot.", "Ich bin krank.", "Ich wohne in der Apotheke."], "answer": 0, "explain": "Chercher = suchen; la pharmacie = die Apotheke."}, {"type": "drag", "q": "Baue die Frage richtig zusammen.", "words": ["Est-ce que", "tu", "vas", "au collège", "aujourd'hui", "?"], "answer": ["Est-ce que", "tu", "vas", "au collège", "aujourd'hui", "?"], "explain": "Richtig: Est-ce que tu vas au collège aujourd'hui ?"}, {"type": "choice", "q": "Hier, nous ___ au restaurant.", "options": ["avons mangé", "allons manger", "mangeons", "manger"], "answer": 0, "explain": "Hier = gestern. Deshalb passt das passé composé: nous avons mangé."}, {"type": "image", "q": "Klicke auf das Bild, das zu „un billet“ passt.", "options": [{"emoji": "🍰"}, {"emoji": "👟"}, {"emoji": "🎟️"}], "answer": 2, "explain": "Un billet = eine Fahrkarte / Eintrittskarte."}, {"type": "choice", "q": "Welche Antwort passt? — Tu peux m'aider, s'il te plaît ?", "options": ["Oui, bien sûr.", "Je suis allemand.", "Il est dans le sac.", "J'ai douze ans."], "answer": 0, "explain": "Oui, bien sûr = Ja, natürlich."}, {"type": "drag", "q": "Baue den Satz: „Ich habe meine Hausaufgaben nach der Schule gemacht.“", "words": ["J'ai fait", "mes devoirs", "après", "l'école"], "answer": ["J'ai fait", "mes devoirs", "après", "l'école"], "explain": "Richtig: J'ai fait mes devoirs après l'école."}, {"type": "choice", "q": "Welche Uhrzeit ist „Il est neuf heures et quart“?", "options": ["9:15", "9:45", "8:15", "12:09"], "answer": 0, "explain": "Et quart = Viertel nach."}, {"type": "image", "q": "Klicke auf das Bild, das zu „le marché“ passt.", "options": [{"emoji": "✈️"}, {"emoji": "🛒🍓"}, {"emoji": "📚"}], "answer": 1, "explain": "Le marché = der Markt."}, {"type": "choice", "q": "Was passt in die Lücke? Ce soir, je vais ___ une série.", "options": ["regarder", "regardé", "regarde", "regardes"], "answer": 0, "explain": "Nach je vais folgt der Infinitiv: regarder."}, {"type": "drag", "q": "Baue den Satz: „Meine Freundin wohnt in einem kleinen Haus.“", "words": ["Ma copine", "habite", "dans", "une petite maison"], "answer": ["Ma copine", "habite", "dans", "une petite maison"], "explain": "Richtig: Ma copine habite dans une petite maison."}, {"type": "choice", "q": "Welche Frage passt zur Antwort: „Je suis allé à Lyon.“", "options": ["Où es-tu allé ?", "Comment tu t'appelles ?", "Tu as faim ?", "Quelle couleur tu préfères ?"], "answer": 0, "explain": "Où es-tu allé ? = Wohin bist du gegangen/gefahren?"}, {"type": "image", "q": "Klicke auf das Bild, das zu „la piscine“ passt.", "options": [{"emoji": "🎬"}, {"emoji": "🥖"}, {"emoji": "🏊"}], "answer": 2, "explain": "La piscine = das Schwimmbad."}, {"type": "choice", "q": "Welche Form ist richtig?", "options": ["Nous avons visité le musée.", "Nous sommes visité le musée.", "Nous avons visiter le musée.", "Nous visité le musée."], "answer": 0, "explain": "Mit visiter bildet man das passé composé mit avoir: nous avons visité."}, {"type": "drag", "q": "Baue die Frage: „Warum lernst du Französisch?“", "words": ["Pourquoi", "tu", "apprends", "le français", "?"], "answer": ["Pourquoi", "tu", "apprends", "le français", "?"], "explain": "Richtig: Pourquoi tu apprends le français ?"}, {"type": "memory", "q": "Memory: Finde die passenden Paare.", "pairs": [["🚉", "la gare"], ["🥖", "la boulangerie"], ["🏊", "la piscine"], ["🎟️", "un billet"]], "explain": "Sehr gut! Alle Paare gefunden."}, {"type": "choice", "q": "Was bedeutet „Je suis en retard“?", "options": ["Ich bin zu spät.", "Ich bin müde.", "Ich bin fertig.", "Ich bin krank."], "answer": 0, "explain": "Être en retard = zu spät sein."}, {"type": "image", "q": "Klicke auf das Bild, das zu „il y a du vent“ passt.", "options": [{"emoji": "🌧️"}, {"emoji": "💨"}, {"emoji": "🌙"}], "answer": 1, "explain": "Il y a du vent = Es ist windig."}, {"type": "drag", "q": "Baue den Satz: „Am Wochenende besuche ich meine Großeltern.“", "words": ["Le week-end", "je rends visite", "à mes grands-parents"], "answer": ["Le week-end", "je rends visite", "à mes grands-parents"], "explain": "Richtig: Le week-end, je rends visite à mes grands-parents."}, {"type": "choice", "q": "Welche Antwort passt? — Tu as déjà mangé des crêpes ?", "options": ["Oui, j'ai déjà mangé des crêpes.", "Oui, je vais demain.", "Non, il est rouge.", "Je suis dans la cuisine."], "answer": 0, "explain": "Déjà + passé composé: j'ai déjà mangé."}, {"type": "image", "q": "Klicke auf das Bild, das zu „une veste“ passt.", "options": [{"emoji": "👒"}, {"emoji": "👟"}, {"emoji": "🧥"}], "answer": 2, "explain": "Une veste = eine Jacke."}, {"type": "choice", "q": "Was passt in die Lücke? Pour aller à la poste, tu tournes ___ gauche.", "options": ["à", "en", "dans", "sur"], "answer": 0, "explain": "Man sagt: tourner à gauche."}, {"type": "drag", "q": "Baue den Satz: „Ich möchte ein Zimmer für zwei Nächte reservieren.“", "words": ["Je voudrais", "réserver", "une chambre", "pour deux nuits"], "answer": ["Je voudrais", "réserver", "une chambre", "pour deux nuits"], "explain": "Richtig: Je voudrais réserver une chambre pour deux nuits."}, {"type": "choice", "q": "Welche Übersetzung passt zu „Il faut prendre le métro“?", "options": ["Man muss die Metro nehmen.", "Man darf nicht essen.", "Ich nehme den Zug.", "Die Metro ist teuer."], "answer": 0, "explain": "Il faut + Infinitiv = man muss."}, {"type": "image", "q": "Klicke auf das Bild, das zu „les devoirs“ passt.", "options": [{"emoji": "🍕"}, {"emoji": "📝"}, {"emoji": "🎧"}], "answer": 1, "explain": "Les devoirs = die Hausaufgaben."}, {"type": "drag", "q": "Baue den Satz: „Gestern bin ich mit meiner Mutter einkaufen gegangen.“", "words": ["Hier", "je suis allé", "faire les courses", "avec ma mère"], "answer": ["Hier", "je suis allé", "faire les courses", "avec ma mère"], "explain": "Richtig: Hier, je suis allé faire les courses avec ma mère."}, {"type": "choice", "q": "Welche Antwort passt? — Qu'est-ce que tu as fait hier soir ?", "options": ["J'ai lu un livre.", "Je vais lire demain.", "Je suis en classe.", "Il est petit."], "answer": 0, "explain": "Die Frage steht in der Vergangenheit: Qu'est-ce que tu as fait ?"}, {"type": "write", "q": "Mini-Schreibaufgabe: Wie heißt „bitte“ auf Französisch?", "answer": ["s'il vous plaît", "s'il te plaît", "sil vous plait", "sil te plait"], "explain": "Höflich: s'il vous plaît. Unter Freunden: s'il te plaît."}, {"type": "choice", "q": "Was bedeutet „Je n'ai pas compris“?", "options": ["Ich habe nicht verstanden.", "Ich habe keine Zeit.", "Ich bin nicht gekommen.", "Ich spreche nicht."], "answer": 0, "explain": "Je n'ai pas compris = Ich habe nicht verstanden."}, {"type": "drag", "q": "Baue die Frage: „Was wirst du heute Abend machen?“", "words": ["Qu'est-ce que", "tu vas", "faire", "ce soir", "?"], "answer": ["Qu'est-ce que", "tu vas", "faire", "ce soir", "?"], "explain": "Richtig: Qu'est-ce que tu vas faire ce soir ?"}, {"type": "image", "q": "Klicke auf das Bild, das zu „la plage“ passt.", "options": [{"emoji": "🏔️"}, {"emoji": "🏥"}, {"emoji": "🏖️"}], "answer": 2, "explain": "La plage = der Strand."}, {"type": "choice", "q": "Welche Form ist richtig?", "options": ["Elles sont parties à huit heures.", "Elles ont parties à huit heures.", "Elles sont partir à huit heures.", "Elles est parties à huit heures."], "answer": 0, "explain": "Partir bildet das passé composé mit être: elles sont parties."}, {"type": "drag", "q": "Baue den Satz: „In meinem Zimmer gibt es einen Schreibtisch und ein Bett.“", "words": ["Dans ma chambre", "il y a", "un bureau", "et un lit"], "answer": ["Dans ma chambre", "il y a", "un bureau", "et un lit"], "explain": "Richtig: Dans ma chambre, il y a un bureau et un lit."}, {"type": "choice", "q": "Was bedeutet „Je peux essayer cette veste ?“", "options": ["Kann ich diese Jacke anprobieren?", "Kann ich diese Jacke kaufen?", "Ich habe diese Jacke verloren.", "Diese Jacke ist zu klein."], "answer": 0, "explain": "Essayer = anprobieren / ausprobieren."}, {"type": "memory", "q": "Memory: Finde die passenden Paare.", "pairs": [["🧥", "une veste"], ["🏖️", "la plage"], ["📝", "les devoirs"], ["💨", "du vent"]], "explain": "Prima! Alle Paare gefunden."}, {"type": "image", "q": "Klicke auf das Bild, das zu „un cadeau“ passt.", "options": [{"emoji": "🚌"}, {"emoji": "🎁"}, {"emoji": "🍳"}], "answer": 1, "explain": "Un cadeau = ein Geschenk."}, {"type": "choice", "q": "Was passt in die Lücke? Je suis plus grand ___ mon frère.", "options": ["que", "comme", "de", "à"], "answer": 0, "explain": "Beim Vergleich benutzt man: plus ... que."}, {"type": "write", "q": "Mini-Schreibaufgabe: Wie heißt „Ich bin zu spät“ auf Französisch?", "answer": ["je suis en retard", "Je suis en retard"], "explain": "Ich bin zu spät = Je suis en retard."}];
let index=0,score=0,locked=false,selectedImage=null,memoryState=null; const app=document.getElementById("app");
function startScreen(){app.innerHTML=`<div class="card center"><h1>Französisch A1+/A2 Quiz</h1><p class="muted">40 komplett neue Aufgaben: Dialoge, Drag & Drop, Bilder ohne Lösungshinweis, Memory, Futur proche und leichtes passé composé.</p><div class="bigEmoji">🇫🇷✨🎮</div><button class="start" onclick="startQuiz()">Start</button></div>`}
function startQuiz(){index=0;score=0;locked=false;renderQuestion()}
function renderFrame(content){const percent=Math.round((index/questions.length)*100);app.innerHTML=`<div class="topbar"><div class="pill">Frage ${index+1}/${questions.length}</div><div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="pill">Punkte: ${score}</div></div><div class="card">${content}</div>`}
function renderQuestion(){locked=false;selectedImage=null;const item=questions[index];if(item.type==="choice")renderChoice(item);if(item.type==="drag")renderDrag(item);if(item.type==="image")renderImage(item);if(item.type==="write")renderWrite(item);if(item.type==="memory")renderMemory(item)}
function renderChoice(item){const shapes=["◆","●","▲","■"];renderFrame(`<h2>${item.q}</h2><div class="answers">${item.options.map((op,i)=>`<button class="answer" onclick="checkChoice(${i})"><span class="shape">${shapes[i]}</span>${op}</button>`).join("")}</div><div id="feedback" class="feedback"></div>`)}
function checkChoice(i){if(locked)return;locked=true;const item=questions[index];showFeedback(i===item.answer,item.explain)}
function renderImage(item){renderFrame(`<h2>${item.q}</h2><div class="imageRow">${item.options.map((op,i)=>`<div class="imageChoice" onclick="selectImage(${i})" id="img${i}">${op.emoji}</div>`).join("")}</div><div class="footerButtons"><button class="smallBtn" onclick="renderQuestion()">Zurücksetzen</button><button class="primary" onclick="checkImage()">Antwort prüfen</button></div><div id="feedback" class="feedback"></div>`)}
function selectImage(i){selectedImage=i;document.querySelectorAll(".imageChoice").forEach(el=>el.classList.remove("selected"));document.getElementById("img"+i).classList.add("selected")}
function checkImage(){if(locked||selectedImage===null)return;locked=true;const item=questions[index];showFeedback(selectedImage===item.answer,item.explain)}
function renderDrag(item){const shuffled=[...item.words].sort(()=>Math.random()-.5);renderFrame(`<h2>${item.q}</h2><p class="muted">Ziehe die Wörter in das gelbe Feld. Auf Tablet/Handy kannst du sie auch antippen.</p><div class="dragZone" id="source">${shuffled.map((w,i)=>`<div class="tile" draggable="true" data-word="${escapeHtml(w)}" id="tile${i}">${w}</div>`).join("")}</div><div class="dropZone" id="target"></div><div class="footerButtons"><button class="smallBtn" onclick="renderQuestion()">Neu mischen</button><button class="primary" onclick="checkDrag()">Antwort prüfen</button></div><div id="feedback" class="feedback"></div>`);setupDrag()}
function setupDrag(){let dragged=null;document.querySelectorAll(".tile").forEach(tile=>{tile.addEventListener("dragstart",e=>{dragged=tile;e.dataTransfer.setData("text/plain",tile.dataset.word)});tile.addEventListener("click",()=>{const target=document.getElementById("target");const source=document.getElementById("source");(tile.parentElement.id==="source"?target:source).appendChild(tile)})});["source","target"].forEach(id=>{const zone=document.getElementById(id);zone.addEventListener("dragover",e=>e.preventDefault());zone.addEventListener("drop",e=>{e.preventDefault();if(dragged)zone.appendChild(dragged)})})}
function checkDrag(){if(locked)return;const item=questions[index];const chosen=[...document.querySelectorAll("#target .tile")].map(t=>t.dataset.word);if(chosen.length!==item.answer.length){showFeedback(false,"Es fehlen noch Wörter. "+item.explain,false);return}locked=true;showFeedback(JSON.stringify(chosen)===JSON.stringify(item.answer),item.explain)}
function renderWrite(item){renderFrame(`<h2>${item.q}</h2><input id="writeAnswer" placeholder="Antwort hier eingeben"><div class="footerButtons"><button class="smallBtn" onclick="document.getElementById('writeAnswer').value=''">Leeren</button><button class="primary" onclick="checkWrite()">Antwort prüfen</button></div><div id="feedback" class="feedback"></div>`);document.getElementById("writeAnswer").focus()}
function checkWrite(){if(locked)return;locked=true;const item=questions[index];const val=normalize(document.getElementById("writeAnswer").value);showFeedback(item.answer.some(a=>normalize(a)===val),item.explain)}
function renderMemory(item){const cards=[];item.pairs.forEach((p,idx)=>{cards.push({value:p[0],pair:idx,kind:"emoji"});cards.push({value:p[1],pair:idx,kind:"word"})});cards.sort(()=>Math.random()-.5);memoryState={cards,open:[],matched:0};renderFrame(`<h2>${item.q}</h2><p class="muted">Klicke ein Bild und das passende französische Wort an.</p><div class="memoryGrid">${cards.map((c,i)=>`<div class="mem" id="mem${i}" onclick="flipMem(${i})">?</div>`).join("")}</div><div id="feedback" class="feedback"></div>`)}
function flipMem(i){const state=memoryState,el=document.getElementById("mem"+i);if(el.classList.contains("matched")||state.open.includes(i)||state.open.length>=2)return;el.textContent=state.cards[i].value;el.classList.add("revealed");state.open.push(i);if(state.open.length===2){const[a,b]=state.open;const ok=state.cards[a].pair===state.cards[b].pair&&state.cards[a].kind!==state.cards[b].kind;setTimeout(()=>{if(ok){document.getElementById("mem"+a).classList.add("matched");document.getElementById("mem"+b).classList.add("matched");state.matched++;if(state.matched===state.cards.length/2){locked=true;showFeedback(true,questions[index].explain)}}else{[a,b].forEach(n=>{const card=document.getElementById("mem"+n);card.textContent="?";card.classList.remove("revealed")})}state.open=[]},650)}}
function showFeedback(ok,text,canScore=true){const fb=document.getElementById("feedback");fb.style.display="block";fb.className="feedback "+(ok?"ok":"bad");if(ok&&canScore)score++;fb.innerHTML=`${ok?"✅ Richtig!":"❌ Fast!"} ${text}<br><br><button class="primary" onclick="nextQuestion()">${index===questions.length-1?"Ergebnis anzeigen":"Weiter"}</button>`}
function nextQuestion(){index++;if(index>=questions.length)finalScreen();else renderQuestion()}
function finalScreen(){const percent=Math.round(score/questions.length*100);let msg="Gut gemacht!";if(percent>=85)msg="Fantastisch! Très bien !";else if(percent>=65)msg="Sehr gut! Weiter so!";else if(percent>=45)msg="Schon ordentlich! Noch einmal spielen hilft.";app.innerHTML=`<div class="card center"><h1>Quiz beendet 🎉</h1><div class="finalScore">${score}/${questions.length}</div><h2>${percent}%</h2><p class="muted">${msg}</p><button class="start" onclick="startQuiz()">Noch einmal spielen</button></div>`}
function normalize(str){return str.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.!?]/g,"").replace(/\s+/g," ")}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
startScreen();
</script>
</body>
</html>
